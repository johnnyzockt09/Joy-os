# Joys picom-Konfiguration – moderne Fenster-Animationen wie Windows 11:
# Fade beim Öffnen/Schließen, weiche Schatten, abgerundete Ecken.
backend = "xrender";
vsync = true;

# Fenster-Animationen (Fade).
fading = true;
fade-delta = 30;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-exclude = [ ];

# Weiche, Windows-11-artige Schatten.
shadow = true;
shadow-radius = 24;
shadow-opacity = 0.45;
shadow-offset-x = 0;
shadow-offset-y = -12;
shadow-exclude = [
  "class_g = 'joys-shell'",
  "class_g = 'JoysSettings'",
  "class_g = 'JoysInstaller'",
  "name = 'Joys'",
];

# Abgerundete Ecken (experimentell).
corner-radius = 14;
round-borders = 1;
rounded-corners-exclude = [
  "_GTK_FRAME_EXTENTS@:c",
];

# Rahmenlose Fenster nicht schattenlos behandeln.
no-dock-shadow = false;
