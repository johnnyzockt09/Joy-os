name: Build ISO

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-iso:
    name: Build Joys ISO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap xorriso mtools grub-pc-bin grub-efi-amd64-bin \
            qemu-utils dosfstools squashfs-tools \
            curl git build-essential

      # QEMU-Systemtest benötigt zusätzlich qemu + ovmf.
      - name: Install QEMU test dependencies
        run: |
          sudo apt-get install -y qemu-system-x86 ovmf socat

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Joys binaries (release)
        run: cargo build --workspace --release

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Build root filesystem
        run: sudo PROFILE=minimal ./scripts/build-rootfs.sh build/rootfs-minimal

      - name: Build kernel + initramfs
        run: sudo PROFILE=minimal ./scripts/build-kernel.sh build/rootfs-minimal

      - name: Build ISO
        run: sudo PROFILE=minimal ./scripts/build-iso.sh

      - name: Test ISO
        run: ./scripts/test-iso.sh dist/Joys-*-x86_64.iso

      # Die sudo-Build-Schritte erzeugen root-gehörige Dateien; für die
      # weiteren (Nicht-root-)Schritte zurückgeben.
      - name: Fix ownership
        run: sudo chown -R "$USER:$USER" dist build 2>/dev/null || true

      # Vollständiger Boottest in QEMU (GRUB→Kernel→Live-System→joys-binaries).
      # Nur bei Tags + manuellem Auslösen, da TCG-Boot mehrere Minuten dauert.
      - name: System test (QEMU)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: ./scripts/test-system.sh dist/Joys-*-x86_64.iso

      # Desktop-Test: openbox/lxpanel/pcmanfm + Netzwerk + Shutdown + Screenshot.
      - name: Desktop test (QEMU)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: ./scripts/test-desktop.sh dist/Joys-*-x86_64.iso

      - name: Generate checksums
        run: |
          cd dist
          sha256sum Joys-*-x86_64.iso > SHA256SUMS
          cat SHA256SUMS
          ls -lh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Joys-ISO
          path: |
            dist/Joys-*-x86_64.iso
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Joys-*-x86_64.iso
            dist/SHA256SUMS
          generate_release_notes: true
